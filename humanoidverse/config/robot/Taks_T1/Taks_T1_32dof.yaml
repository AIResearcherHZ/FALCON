# @package _global_

defaults:
  - robot_base

robot:
  num_bodies: 33
  dof_obs_size: 32
  actions_dim: 32
  lower_body_actions_dim: 15
  upper_body_actions_dim: 17
  body_keys: ["lower_body", "upper_body"]
