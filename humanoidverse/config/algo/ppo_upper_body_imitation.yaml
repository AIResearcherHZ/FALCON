# @package _global_

algo:
  _target_: humanoidverse.agents.ppo.ppo.PPO
  _recursive_: False
  config:
    num_learning_epochs: 5
    num_mini_batches: 4
    clip_param: 0.2
    gamma: 0.99
    lam: 0.95
    value_loss_coef: 1.0
    entropy_coef: 0.01
    actor_learning_rate: 1.e-4
    critic_learning_rate: 1.e-4
    weight_decay: 1.e-2
    max_grad_norm: 1.0
    use_clipped_value_loss: True
    schedule: "adaptive"
    desired_kl: 0.01

    num_steps_per_env: 24
    save_interval: 100
    load_optimizer: True
    init_noise_std: 0.6

    num_learning_iterations: 10000
    init_at_random_ep_len: True
    eval_callbacks: null

    module_dict:
      actor:
        input_dim: [actor_obs]
        history_length: ${obs.history_length}
        output_dim: [robot_action_dim]
        layer_config:
          type: MLP
          hidden_dims: [256, 128, 64]
          activation: ELU
      critic:
        type: MLP
        input_dim: [critic_obs]
        history_length: ${obs.history_length}
        output_dim: [1]
        layer_config:
          type: MLP
          hidden_dims: [256, 128, 64]
          activation: ELU
